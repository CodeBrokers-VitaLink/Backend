spring.application.name=VitaLink Platform
server.port=${PORT:8080}
spring.profiles.default=dev
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:vitalink}?useSSL=${DATABASE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:vitalink}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=com.vitalink.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.demo-data=false
