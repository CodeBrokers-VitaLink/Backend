name: vitalink

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vitalink
      MYSQL_USER: vitalink
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-vitalink_demo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_demo_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - vitalink_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: vitalink
      DATABASE_USER: vitalink
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vitalink_demo_password}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  vitalink_mysql:
